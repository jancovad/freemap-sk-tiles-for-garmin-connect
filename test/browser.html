<!doctype html>
<html lang="sk" data-device-pixel-ratio="1">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'none'">

  </head>

      <div class="leaflet-tile leaflet-tile-loaded">

          alt=""
          src="https://maps.googleapis.com/maps/vt?pb=!1m5!1m4!1i12!2i2264!3i1404!4i256!2m3!1e0&amp;key=test-only"
        >
      </div>
    </div>

        >
      </div>
    </div>

    </div>
    <div id="provider-settings-fixture" role="dialog" aria-modal="true" hidden>
      <div>
        <button
          id="test-provider-button"
          type="button"
          aria-haspopup="listbox"
          aria-expanded="false"
          aria-controls="test-provider-listbox"
        >
          <span><span id="test-provider-label">Google Maps</span></span>
        </button>
        <ul id="test-provider-listbox" role="listbox">
          <li class="provider-option provider-active" data-value="google" role="option" aria-selected="true">
            <div data-value="google"><span data-value="google">Google Maps</span></div>
          </li>
          <li class="provider-option" data-value="here" role="option" aria-selected="false">
            <div data-value="here"><span data-value="here">Here Maps</span></div>
          </li>
          <li class="provider-option" data-value="osm" role="option" aria-selected="false">
            <div data-value="osm"><span data-value="osm">OpenStreetMap</span></div>
          </li>
        </ul>
        <hr>
        <div>
          <button type="button" aria-label="default">Predvolené</button>
          <button type="button" aria-label="satellite">Satelit</button>
          <button type="button" aria-label="terrain">Terén</button>
        </div>
      </div>
    </div>
    <script src="storage-mock.js"></script>
    <script src="device-pixel-ratio-mock.js"></script>
    <script src="../src/tile-url.js"></script>
